import os

os.makedirs("assets", exist_ok=True)

svg_content = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a0b2e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulse {
        0% { r: 4px; opacity: 0.6; }
        50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
        100% { r: 4px; opacity: 0.6; }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes waveMotion {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }
      @keyframes textShimmer {
        0% { stop-color: #00f2fe; }
        50% { stop-color: #9d4edd; }
        100% { stop-color: #00f2fe; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      
      .pulsing-node { animation: pulse 3s infinite ease-in-out; }
      .pulsing-node-delay1 { animation: pulse 3s infinite ease-in-out 1s; }
      .pulsing-node-delay2 { animation: pulse 3s infinite ease-in-out 2s; }
      .radar-ring { transform-origin: 1020px 200px; animation: radarRotate 20s linear infinite; }
      .radar-ring-reverse { transform-origin: 1020px 200px; animation: radarRotate 12s linear infinite reverse; }
      .animated-wave { stroke-dasharray: 10, 10; animation: waveMotion 4s linear infinite; }
      .scan-line { animation: scanline 6s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Scan Line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(0, 242, 254, 0.3)" stroke-width="2" class="scan-line" />

  <!-- Left Side: Digital Twin Graphics & Cyber Nodes -->
  <g transform="translate(60, 40)">
    <!-- Connected Network Lines -->
    <path d="M 100 100 L 250 60 L 350 160 L 220 260 L 100 100 Z" fill="url(#glowGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 250 60 L 420 80 L 480 200 L 350 160" fill="none" stroke="#7f00ff" stroke-width="1.5" class="animated-wave" />
    <path d="M 220 260 L 320 300 L 480 200" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="5 5" />

    <!-- Nodes -->
    <circle cx="100" cy="100" r="6" fill="#00f2fe" class="pulsing-node" />
    <circle cx="250" cy="60" r="7" fill="#7f00ff" class="pulsing-node-delay1" />
    <circle cx="350" cy="160" r="8" fill="#00f2fe" class="pulsing-node-delay2" />
    <circle cx="220" cy="260" r="6" fill="#4facfe" class="pulsing-node" />
    <circle cx="420" cy="80" r="5" fill="#00f2fe" class="pulsing-node-delay1" />
    <circle cx="480" cy="200" r="7" fill="#9d4edd" class="pulsing-node-delay2" />
    <circle cx="320" cy="300" r="6" fill="#00f2fe" class="pulsing-node" />
  </g>

  <!-- Right Side: Rotating Radar / Cyber Ring -->
  <g class="radar-ring">
    <circle cx="1020" cy="200" r="140" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="2" stroke-dasharray="20 10 5 10" />
    <circle cx="1020" cy="200" r="100" fill="none" stroke="rgba(141, 78, 221, 0.3)" stroke-width="1.5" stroke-dasharray="40 15" />
    <polygon points="1020,70 1030,90 1010,90" fill="#00f2fe" />
    <polygon points="1020,330 1030,310 1010,310" fill="#00f2fe" />
  </g>

  <g class="radar-ring-reverse">
    <circle cx="1020" cy="200" r="120" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" stroke-dasharray="10 15 30 15" />
    <circle cx="1020" cy="200" r="60" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="5 5" />
  </g>
  <circle cx="1020" cy="200" r="10" fill="#00f2fe" class="pulsing-node" />

  <!-- Center Title & Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="175" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="2">
      AWESOME SIMULATION &amp; DIGITAL TWIN
    </text>
    <text x="600" y="225" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="4" opacity="0.95">
      PLATFORMS ECOSYSTEM
    </text>

    <!-- Subtitle -->
    <text x="600" y="275" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#a0aec0" letter-spacing="1.5">
      ⚡ Open-Source Infrastructure · Industrial IoT · Physics-Based Modeling · Enterprise SaaS 🌐
    </text>

    <!-- Decorative Badges in SVG Banner -->
    <g transform="translate(420, 310)">
      <rect x="0" y="0" width="110" height="26" rx="13" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1"/>
      <text x="55" y="17" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00f2fe">Co-Simulation</text>

      <rect x="125" y="0" width="110" height="26" rx="13" fill="rgba(127, 0, 255, 0.15)" stroke="#9d4edd" stroke-width="1"/>
      <text x="180" y="17" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#9d4edd">Industry 4.0</text>

      <rect x="250" y="0" width="110" height="26" rx="13" fill="rgba(79, 172, 254, 0.15)" stroke="#4facfe" stroke-width="1"/>
      <text x="305" y="17" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#4facfe">Physics + AI</text>
    </g>
  </g>
</svg>
'''

with open("assets/banner.svg", "w", encoding="utf-8") as f:
    f.write(svg_content)

print("assets/banner.svg written successfully!")
