<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0b1124" />
      <stop offset="75%" stop-color="#140a2b" />
      <stop offset="100%" stop-color="#070c1b" />
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glow Filters & Spotlights -->
    <radialGradient id="leftSpot" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightSpot" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Dynamic CSS Keyframe Animations -->
    <style>
      @keyframes pulseNode {
        0% { r: 5px; opacity: 0.5; filter: drop-shadow(0 0 2px #00f2fe); }
        50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 12px #00f2fe); }
        100% { r: 5px; opacity: 0.5; filter: drop-shadow(0 0 2px #00f2fe); }
      }

      @keyframes pulseNodePurple {
        0% { r: 5px; opacity: 0.5; filter: drop-shadow(0 0 2px #9d4edd); }
        50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 12px #9d4edd); }
        100% { r: 5px; opacity: 0.5; filter: drop-shadow(0 0 2px #9d4edd); }
      }

      @keyframes rotateClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rotateCounterClockwise {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes dashFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      @keyframes scanVertical {
        0% { transform: translateY(-10px); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateY(430px); opacity: 0; }
      }

      @keyframes floatBadge {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }

      @keyframes titleShimmer {
        0% { stop-color: #00f2fe; }
        50% { stop-color: #00ff88; }
        100% { stop-color: #00f2fe; }
      }

      .node-p1 { animation: pulseNode 3s infinite ease-in-out; }
      .node-p2 { animation: pulseNode 3s infinite ease-in-out 1s; }
      .node-p3 { animation: pulseNode 3s infinite ease-in-out 2s; }
      .node-purple { animation: pulseNodePurple 3.5s infinite ease-in-out 0.5s; }

      .radar-outer { transform-origin: 1010px 210px; animation: rotateClockwise 25s linear infinite; }
      .radar-inner { transform-origin: 1010px 210px; animation: rotateCounterClockwise 15s linear infinite; }
      .twin-gear { transform-origin: 190px 210px; animation: rotateClockwise 30s linear infinite; }
      
      .flowing-dash { stroke-dasharray: 8, 8; animation: dashFlow 3s linear infinite; }
      .scanner-beam { animation: scanVertical 7s ease-in-out infinite; }

      .badge-1 { animation: floatBadge 4s ease-in-out infinite; }
      .badge-2 { animation: floatBadge 4s ease-in-out infinite 1s; }
      .badge-3 { animation: floatBadge 4s ease-in-out infinite 2s; }
      .badge-4 { animation: floatBadge 4s ease-in-out infinite 3s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />
  <rect width="1200" height="420" fill="url(#leftSpot)" />
  <rect width="1200" height="420" fill="url(#rightSpot)" />

  <!-- Animated Vertical Laser Scanline -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" class="scanner-beam" />

  <!-- LEFT GRAPHIC: Digital Twin Topology Mesh -->
  <g transform="translate(40, 20)">
    <!-- Rotating Background Gear Ring -->
    <g class="twin-gear">
      <circle cx="150" cy="190" r="110" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5" stroke-dasharray="15 10 5 10" />
      <circle cx="150" cy="190" r="75" fill="none" stroke="rgba(157, 78, 221, 0.2)" stroke-width="1" stroke-dasharray="30 15" />
    </g>

    <!-- Mesh Wireframe Connections -->
    <path d="M 70 120 L 150 70 L 250 110 L 270 210 L 190 280 L 90 240 Z" fill="url(#cyanPurpleGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M 150 70 L 170 170 L 270 210" fill="none" stroke="#9d4edd" stroke-width="1.5" class="flowing-dash" />
    <path d="M 70 120 L 170 170 L 190 280" fill="none" stroke="#00f2fe" stroke-width="1.5" class="flowing-dash" />
    <path d="M 250 110 L 170 170 L 90 240" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Isometric Twin Cube Overlay (Physical -> Digital Representation) -->
    <g transform="translate(170, 170)">
      <!-- Top Face -->
      <polygon points="0,-30 25,-15 0,0 -25,-15" fill="rgba(0, 242, 254, 0.25)" stroke="#00f2fe" stroke-width="1" />
      <!-- Left Face -->
      <polygon points="-25,-15 0,0 0,30 -25,15" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="0,0 25,-15 25,15 0,30" fill="rgba(157, 78, 221, 0.2)" stroke="#9d4edd" stroke-width="1" />
    </g>

    <!-- Animated Nodes -->
    <circle cx="70" cy="120" r="6" fill="#00f2fe" class="node-p1" />
    <circle cx="150" cy="70" r="7" fill="#00ff88" class="node-p2" />
    <circle cx="250" cy="110" r="6" fill="#9d4edd" class="node-purple" />
    <circle cx="270" cy="210" r="8" fill="#00f2fe" class="node-p3" />
    <circle cx="190" cy="280" r="6" fill="#4facfe" class="node-p1" />
    <circle cx="90" cy="240" r="7" fill="#00f2fe" class="node-p2" />
    <circle cx="170" cy="170" r="8" fill="#00f2fe" class="node-p3" />
  </g>

  <!-- RIGHT GRAPHIC: Cyber Telemetry & Hologram Radar -->
  <g transform="translate(0, 0)">
    <g class="radar-outer">
      <circle cx="1010" cy="210" r="145" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="2" stroke-dasharray="25 15 5 15" />
      <circle cx="1010" cy="210" r="115" fill="none" stroke="rgba(157, 78, 221, 0.3)" stroke-width="1.5" stroke-dasharray="40 20" />
      <!-- Outer Pointer Triangles -->
      <polygon points="1010,60 1020,80 1000,80" fill="#00f2fe" />
      <polygon points="1010,360 1020,340 1000,340" fill="#00f2fe" />
      <polygon points="860,210 880,200 880,220" fill="#9d4edd" />
      <polygon points="1160,210 1140,200 1140,220" fill="#9d4edd" />
    </g>

    <g class="radar-inner">
      <circle cx="1010" cy="210" r="85" fill="none" stroke="rgba(0, 255, 136, 0.35)" stroke-width="1" stroke-dasharray="10 10" />
      <circle cx="1010" cy="210" r="55" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6" />
    </g>

    <!-- Central Glowing Core -->
    <circle cx="1010" cy="210" r="18" fill="url(#cyanPurpleGrad)" class="node-p1" />
    <circle cx="1010" cy="210" r="8" fill="#00f2fe" />

    <!-- Orbital Satellites -->
    <circle cx="955" cy="160" r="5" fill="#00ff88" class="node-p2" />
    <line x1="1010" y1="210" x2="955" y2="160" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1" stroke-dasharray="3 3" />

    <circle cx="1065" cy="260" r="6" fill="#9d4edd" class="node-purple" />
    <line x1="1010" y1="210" x2="1065" y2="260" stroke="rgba(157, 78, 221, 0.4)" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- CENTER CONTENT: Main Branding Header -->
  <g text-anchor="middle">
    <!-- Top Category Tag -->
    <g transform="translate(600, 115)">
      <rect x="-140" y="-18" width="280" height="26" rx="13" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
      <text x="0" y="-1" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="3">
        ⚡ CURATED ECOSYSTEM DIRECTORY ⚡
      </text>
    </g>

    <!-- Main Title Lines -->
    <text x="600" y="175" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" fill="url(#titleGrad)" letter-spacing="2.5" filter="drop-shadow(0 4px 12px rgba(0,242,254,0.3))">
      AWESOME SIMULATION &amp; DIGITAL TWIN
    </text>

    <text x="600" y="225" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="5" opacity="0.95">
      PLATFORMS ECOSYSTEM
    </text>

    <!-- Subtitle Line -->
    <text x="600" y="270" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#a0aec0" letter-spacing="1.2">
      Industrial IoT (IIoT) · Asset Administration Shells (AAS) · FMI/FMU Co-Simulation · 3D Spatial Twins
    </text>

    <!-- Interactive Pill Badges -->
    <g transform="translate(600, 310)">
      <!-- Pill 1: Open Source -->
      <g transform="translate(-250, 0)" class="badge-1">
        <rect x="0" y="0" width="115" height="30" rx="15" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.2" />
        <text x="57" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00f2fe">Open Source</text>
      </g>

      <!-- Pill 2: FMI / FMU -->
      <g transform="translate(-120, 0)" class="badge-2">
        <rect x="0" y="0" width="115" height="30" rx="15" fill="rgba(157, 78, 221, 0.15)" stroke="#9d4edd" stroke-width="1.2" />
        <text x="57" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#9d4edd">FMI / FMU</text>
      </g>

      <!-- Pill 3: Industry 4.0 -->
      <g transform="translate(10, 0)" class="badge-3">
        <rect x="0" y="0" width="115" height="30" rx="15" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-width="1.2" />
        <text x="57" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00ff88">Industry 4.0</text>
      </g>

      <!-- Pill 4: SaaS & Cloud -->
      <g transform="translate(140, 0)" class="badge-4">
        <rect x="0" y="0" width="115" height="30" rx="15" fill="rgba(79, 172, 254, 0.15)" stroke="#4facfe" stroke-width="1.2" />
        <text x="57" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#4facfe">SaaS &amp; Cloud</text>
      </g>
    </g>
  </g>
</svg>
